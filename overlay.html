function getDecoAnimation(decoClass) {
  return DECO_ANIMATIONS[decoClass] || "decoBob 2s ease-in-out infinite";
}

async function loadTheme(themeName, force = false) {
  if (!themeName) return;
  if (currentTheme === themeName && !force) {
    return;
  }

  try {
    console.log(`🎨 Loading theme: ${themeName}`);
    const r = await fetch(`/static/themes/${themeName}/config.json?t=${Date.now()}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const config = await r.json();

    currentTheme = themeName;

    // Đổi CSS
    const cssEl = document.getElementById('themeCSS');
    cssEl.href = `/static/themes/${themeName}/theme.css?v=${Date.now()}`;

    // Đổi title + logo
    document.getElementById('themeLogo').textContent = config.logo || '🏆';
    document.getElementById('themeTitle').textContent = config.title || 'AUCTION';
    document.getElementById('decoText').textContent = config.deco_text || '';
    document.getElementById('decoLeft').textContent = config.deco_left || '';
    document.getElementById('decoRight').textContent = config.deco_right || '';
    document.getElementById('winnerHat').textContent = config.winner_hat || '👑';

    // Marquee
    const marquee = config.marquee || [];
    const track = document.getElementById('marqueeTrack');
    const items = marquee.map(t => `<span>${t}</span>`).join('');
    track.innerHTML = items + items;

    // ★ Decorations — GÁN ANIMATION
    const deco = document.getElementById('themeDecorations');
    deco.innerHTML = (config.decorations || []).map(d => {
      const styles = [
        `position: absolute`,
        `font-size: ${d.size || '40px'}`,
        `pointer-events: none`,
        `will-change: transform, opacity`,
        `filter: drop-shadow(0 0 15px currentColor)`,
      ];
      if (d.top) styles.push(`top: ${d.top}`);
      if (d.bottom) styles.push(`bottom: ${d.bottom}`);
      if (d.left) styles.push(`left: ${d.left}`);
      if (d.right) styles.push(`right: ${d.right}`);

      // ★ Gán animation theo class
      const anim = getDecoAnimation(d.class);
      styles.push(`animation: ${anim}`);

      return `<div class="deco-${d.class}" style="${styles.join(';')}">${d.emoji}</div>`;
    }).join('');

    // Tạo particles
    createParticles(config.particles);

    console.log(`✅ Theme loaded: ${config.title}`);
  } catch (e) {
    console.warn(`⚠️ Lỗi theme ${themeName}:`, e);
  }
}

// ★ Tạo particles bay
function createParticles(colors) {
  const deco = document.getElementById('themeDecorations');
  if (!deco) return;

  // Xóa particles cũ
  deco.querySelectorAll('.particle').forEach(p => p.remove());

  const palette = colors || ['#ffffff', '#cccccc', '#ffd700'];
  const count = 30;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    const color = palette[Math.floor(Math.random() * palette.length)];
    p.style.background = color;
    p.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    p.style.setProperty('--px', (Math.random() - 0.5) * 200 + 'px');
    p.style.width = (4 + Math.random() * 6) + 'px';
    p.style.height = p.style.width;
    deco.appendChild(p);
  }
}
// ★ Tạo particles bay xung quanh
function createParticles() {
  const deco = document.getElementById('themeDecorations');
  if (!deco) return;

  // Xóa particles cũ
  deco.querySelectorAll('.particle').forEach(p => p.remove());

  const colors = ['#ff8000', '#ffcc00', '#ff5500', '#a020f0', '#ff0055'];
  const count = 25;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.boxShadow = `0 0 10px ${p.style.background}, 0 0 20px ${p.style.background}`;
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    p.style.setProperty('--px', (Math.random() - 0.5) * 100 + 'px');
    p.style.width = (4 + Math.random() * 6) + 'px';
    p.style.height = p.style.width;
    deco.appendChild(p);
  }
}
// ============================================================
// UTILS
// ============================================================
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function initials(name) {
  const cleaned = String(name).replace(/[^A-Za-z0-9 ]/g, '').trim();
  const parts = cleaned.split(/\s+/);
  if (parts.length >= 2) {
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  return cleaned.slice(0, 2).toUpperCase() || '?';
}

function avatarColor(name) {
  const colors = [
    '#fe2c55', '#ff6b9d', '#c77dff', '#7c5cff',
    '#5c9dff', '#00bfff', '#00d68f', '#ffd700', '#ff6b35',
  ];
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = (hash * 31 + name.charCodeAt(i)) % 1000000;
  }
  return colors[hash % colors.length];
}

async function loadBotAvatars() {
  try {
    const r = await fetch('/api/bots/avatars');
    const data = await r.json();
    botAvatars = data.avatars || [];
  } catch (e) {
    botAvatars = [];
  }
}

const avatarCache = {};

function renderTieAvatar(container, displayName) {
  const avatarsDir = '/static/assets/bots/avatars/';

  if (botAvatars.length === 0) {
    const ini = initials(displayName);
    const bg = avatarColor(displayName);
    container.innerHTML = `<span style="background: ${bg};">${ini}</span>`;
    return;
  }

  if (!avatarCache[displayName]) {
    avatarCache[displayName] =
      botAvatars[Math.floor(Math.random() * botAvatars.length)];
  }
  const pick = avatarCache[displayName];

  const img = new Image();
  img.onload = () => {
    container.innerHTML = `<img src="${avatarsDir}${pick}" alt="">`;
  };
  img.onerror = () => {
    const ini = initials(displayName);
    const bg = avatarColor(displayName);
    container.innerHTML = `<span style="background: ${bg};">${ini}</span>`;
  };
  img.src = avatarsDir + pick;
}

function showTiePopup(leaders, scores) {
  const popup = document.getElementById('tieOverlay');
  if (leaders.length < 2) return;

  document.getElementById('tieName1').textContent = leaders[0];
  document.getElementById('tieName2').textContent = leaders[1];
  document.getElementById('tieScore1').textContent = scores[0] || 0;
  document.getElementById('tieScore2').textContent = scores[1] || 0;

  renderTieAvatar(document.getElementById('tieAvatar1'), leaders[0]);
  renderTieAvatar(document.getElementById('tieAvatar2'), leaders[1]);

  popup.classList.remove('show', 'hide');
  void popup.offsetWidth;
  popup.classList.add('show');

  if (tiePopupTimer) clearTimeout(tiePopupTimer);
  tiePopupTimer = setTimeout(() => {
    popup.classList.add('hide');
    setTimeout(() => popup.classList.remove('show', 'hide'), 500);
  }, 2500);
}

function showWinner(name) {
  const overlay = document.getElementById('winnerOverlay');
  document.getElementById('woName').textContent = name;

  overlay.classList.remove('show', 'hide');
  void overlay.offsetWidth;
  overlay.classList.add('show');

  if (winnerTimer) clearTimeout(winnerTimer);
  winnerTimer = setTimeout(() => {
    overlay.classList.add('hide');
    setTimeout(() => overlay.classList.remove('show', 'hide'), 700);
  }, 7000);
}

function renderState(d) {
  if (!d) return;

  const timerEl = document.getElementById('timer');
  const snapBadge = document.getElementById('snapBadge');
  const ranking = document.getElementById('ranking');
  const winnerOverlay = document.getElementById('winnerOverlay');

  if (d.phase === 'idle') {
    timerEl.textContent = '--:--';
    timerEl.classList.remove('warn');
    snapBadge.classList.remove('show');
    winnerOverlay.classList.remove('show', 'hide');
    lastSnapCount = 0;
  } else if (d.phase === 'main') {
    timerEl.textContent = fmtTime(d.remaining);
    timerEl.classList.toggle('warn', d.remaining <= 10);
    snapBadge.classList.remove('show');
  } else if (d.phase === 'snap') {
    timerEl.textContent = fmtTime(d.remaining);
    timerEl.classList.add('warn');

    if (d.snap_count > lastSnapCount) {
      lastSnapCount = d.snap_count;
      const leaders = d.leaders || [];
      if (leaders.length >= 2 && d.top) {
        const scoreMap = {};
        d.top.forEach(row => { scoreMap[row.user] = row.score; });
        const scores = leaders.slice(0, 2).map(u => scoreMap[u] || 0);
        showTiePopup(leaders, scores);
      }
    }

    snapBadge.classList.add('show');
    snapBadge.textContent = '⚡ SNAP #' + d.snap_count
                          + ' · ' + Math.round(d.remaining) + 's';
  } else if (d.phase === 'finished') {
    timerEl.textContent = '00:00';
    timerEl.classList.remove('warn');
    snapBadge.classList.remove('show');

    if (d.winner && d.winner !== lastWinner) {
      lastWinner = d.winner;
      showWinner(d.winner);
    }
  } else {
    lastWinner = null;
    lastSnapCount = 0;
    winnerOverlay.classList.remove('show', 'hide');
  }

  if (!d.top || d.top.length === 0) {
    ranking.innerHTML = '<div class="empty">Waiting for players...</div>';
  } else {
    const leaders = new Set(d.leaders || []);
    const medals = ['🥇','🥈','🥉'];
    ranking.innerHTML = d.top.map((row, i) => {
      const rank = i + 1;
      const cls = [
        'row',
        rank <= 3 ? 'rank-' + rank : '',
        leaders.has(row.user) && d.phase !== 'finished' ? 'leader' : ''
      ].filter(Boolean).join(' ');
      const medal = i < 3 ? medals[i] : '#' + rank;
      return '<div class="' + cls + '">' +
        '<div class="medal">' + medal + '</div>' +
        '<div class="user">' + escapeHtml(row.user) + '</div>' +
        '<div class="score">' + row.score + '</div>' +
      '</div>';
    }).join('');
  }
}

function connect() {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  try {
    ws = new WebSocket(proto + '://' + location.host + '/ws');
  } catch (e) {
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => console.log('🔌 Widget connected');

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);

      if (msg.type === 'state') {
        renderState(msg.data);
      } else if (msg.type === 'theme_change') {
        // ★ QUAN TRỌNG — nhận lệnh đổi theme từ app
        console.log('🎨 Theme change received:', msg.data.theme);
        loadTheme(msg.data.theme, true);
      } else if (!msg.type) {
        renderState(msg);
      }
    } catch (err) {}
  };

  ws.onclose = () => {
    reconnectTimer = setTimeout(connect, 2000);
  };
  ws.onerror = () => { try { ws.close(); } catch(e) {} };
}

// ============================================================
// INIT
// ============================================================
loadBotAvatars();

// Đọc theme từ URL (nếu có) — VD: /widget.html?theme=christmas
const urlParams = new URLSearchParams(location.search);
const themeFromUrl = urlParams.get('theme') || 'halloween';
loadTheme(themeFromUrl);

connect();
setInterval(loadBotAvatars, 30000);
</script>
