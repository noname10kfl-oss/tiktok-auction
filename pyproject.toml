[project]
name = "tiktok-auction"
version = "1.0.0"
description = "TikTok Live Auction Tool with Snap Time"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "TikTokLive>=6.0",
    "PySide6>=6.6",
    "sounddevice>=0.5.6",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "pyside6-webengine>=6.12.0.140",
    "customtkinter>=6.0.0",
    "requests>=2.34.2",
]

[project.scripts]
tiktok-auction = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pyinstaller>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]
